<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Produtos - Império Leste</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            background: #51703C;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .voltar {
            margin-left: 10px;
            color: #51703C;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Adicionar Produtos à Venda #{{ id_venda }}</h1>

    <form method="POST">

        <label>Produto</label>

        <select name="id_produto" required>
            <option value="">Selecione um produto</option>

            {% for produto in produtos %}
                <option value="{{ produto.id_produto }}">
                    {{ produto.nome }} - R$ {{ "%.2f"|format(produto.preco_venda) }}
                </option>
            {% endfor %}

        </select>

        <label>Quantidade</label>

        <input type="number" name="quantidade" min="1" value="1" required>

        <button type="submit">Adicionar Produto</button>

<a href="/vendas" class="voltar">Finalizar Venda</a>

    </form>

</div>

</body>
</html>
