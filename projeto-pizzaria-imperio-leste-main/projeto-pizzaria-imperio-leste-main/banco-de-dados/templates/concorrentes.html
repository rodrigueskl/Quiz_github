
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Concorrentes - Império Leste</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1e293b;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: #64748b;
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
            color: #51703C;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Concorrentes</h1>

    <table>
        <thead>
            <tr>
                {% for coluna in concorrentes[0].keys() %}
                    <th>{{ coluna }}</th>
                {% endfor %}
            </tr>
        </thead>

        <tbody>
            {% for concorrente in concorrentes %}
                <tr>
                    {% for coluna in concorrente.keys() %}
                        <td>{{ concorrente[coluna] }}</td>
                    {% endfor %}
                </tr>
            {% else %}
                <tr>
                    <td>Nenhum concorrente cadastrado.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/" class="voltar">← Voltar ao Dashboard</a>

</div>

</body>
</html>
