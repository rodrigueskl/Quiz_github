
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vendas - Império Leste</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #222;
        }

        .novo {
            display: inline-block;
            background: #51703C;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Vendas</h1>

    <a href="/nova-venda" class="novo">+ Nova Venda</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Data da Venda</th>
                <th>Observação</th>
                <th>Total</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            
{% for venda in vendas %}
<tr>
    <td>{{ venda.id_venda }}</td>
    <td>{{ venda.nome_cliente or 'Cliente não identificado' }}</td>
    <td>{{ venda.data_venda }}</td>
    <td>{{ venda.observacao or '-' }}</td>
    <td>R$ {{ "%.2f"|format(venda.total or 0) }}</td>

    <td>
        <a href="/detalhes-venda/{{ venda.id_venda }}"
           style="color: #51703C; text-decoration: none; font-weight: bold;">
            Visualizar
        </a>
    </td>
</tr>
{% endfor %}

        </tbody>
    </table>

</div>

</body>
</html>
